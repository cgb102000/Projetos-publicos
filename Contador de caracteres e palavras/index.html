<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Caracteres e Palavras</title>
    <meta name="description" content="Conte caracteres e palavras de um texto em tempo real.">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Contador de Caracteres e Palavras</h1>
        <div class="field">
            <label for="input">Digite ou cole seu texto:</label>
            <textarea id="input" rows="8" placeholder="Comece a digitar..."></textarea>
        </div>
        <div class="counter" aria-live="polite">
            <div id="characters-count">0 caracteres</div>
            <div id="characters-no-spaces">0 caracteres sem espaços</div>
            <div id="words-count">0 palavras</div>
        </div>
        <button type="button" id="clear">Limpar texto</button>
    </main>
</body>
</html>
