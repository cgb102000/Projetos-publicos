<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex do Caio</title>
  <meta name="description" content="Pokédex que consulta dados de Pokémon em tempo real na PokéAPI.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Pokédex do Caio</h1>

    <form id="searchForm" class="busca">
      <label for="pokemonName">Procure por nome ou número</label>
      <div class="busca-linha">
        <input type="text" id="pokemonName" placeholder="Ex.: pikachu ou 25" autocomplete="off" required>
        <button type="submit">Procurar</button>
        <button type="button" id="random" class="secundario" title="Pokémon aleatório">Aleatório</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="pokemonCard" aria-live="polite"></section>
  </main>

  <footer>
    Dados da <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
