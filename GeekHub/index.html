<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekHub</title>
  <meta name="description" content="Catálogo de filmes e animes consumindo a API do GeekCore (Express + MongoDB).">
  <link rel="icon" href="assets/ico.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="index.html">Geek<span>Hub</span></a>
    <form id="form-busca" class="busca" role="search">
      <input id="campo-busca" type="search" placeholder="Buscar filmes e animes" aria-label="Buscar filmes e animes">
      <button type="submit">Buscar</button>
    </form>
  </header>

  <main class="conteudo">
    <nav id="categorias" class="categorias" aria-label="Categorias"></nav>
    <h1 id="titulo-secao">Adicionados recentemente</h1>
    <div id="lista" class="grade" aria-live="polite">
      <p class="aviso">Carregando catálogo…</p>
    </div>
  </main>

  <footer class="rodape">Feito por Caio Gabriel · dados da API <a href="https://github.com/cgb102000/Projetos-publicos/tree/main/GeekCore">GeekCore</a></footer>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
