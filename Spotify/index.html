<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Música para Todos</title>
    <meta name="description" content="Busque músicas, artistas e álbuns em tempo real usando a API do Spotify.">
    <link rel="icon" href="src/assets/musica.png" type="image/png">
    <link rel="stylesheet" href="src/assets/style.css">
</head>
<body>
    <header class="topo">
        <div class="container topo-conteudo">
            <a href="./" class="marca">
                <img src="src/assets/musica.png" alt="" width="32" height="32">
                Música para Todos
            </a>
        </div>
    </header>

    <main class="container">
        <section class="busca">
            <h1>Encontre músicas, artistas e álbuns</h1>
            <form id="searchForm" role="search">
                <label for="searchInput" class="sr-only">Buscar</label>
                <input type="search" id="searchInput" placeholder="Digite o nome do artista, música ou álbum..." autocomplete="off" required>
                <button type="submit">Buscar</button>
            </form>
            <div class="sugestoes">
                <span>Experimente:</span>
                <button type="button" class="chip">Legião Urbana</button>
                <button type="button" class="chip">Anitta</button>
                <button type="button" class="chip">Coldplay</button>
                <button type="button" class="chip">Djavan</button>
            </div>
        </section>

        <p id="status" role="status" aria-live="polite"></p>
        <div id="content"></div>
    </main>

    <footer class="rodape">
        <p>Dados fornecidos pela Web API do Spotify. Projeto de estudo de Caio Gabriel, sem vínculo com o Spotify.</p>
    </footer>

    <script type="module" src="./app.js"></script>
</body>
</html>
